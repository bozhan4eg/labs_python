<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>СтанкоСервис — регистрация</title>
    <link rel="stylesheet" href="{{ STATIC_URL }}css/repair.css">
</head>
<body class="create">
<div class="top-bar">
    <a href="{% url 'login_page' %}">Вход</a>
</div>
<div class="header">
    <img src="{{ STATIC_URL }}img/logo.png" alt="СтанкоСервис — техническое обслуживание станков"/>
</div>
<div class="content">
    <h1>Регистрация</h1>
    <form method="POST">{% csrf_token %}
        <label for="id_username">Имя пользователя</label>
        <input type="text" name="username" id="id_username" value="{{ form.username }}">

        <label for="id_email">Электронная почта</label>
        <input type="text" name="email" id="id_email" value="{{ form.email }}">

        <label for="id_password1">Пароль</label>
        <input type="password" name="password1" id="id_password1">

        <label for="id_password2">Повторите пароль</label>
        <input type="password" name="password2" id="id_password2">

        <input type="submit" value="Зарегистрироваться">
    </form>
    {% if form.errors %}
    <ul class="form-errors">
        {% for e in form.errors %}
        <li>{{ e }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    <p class="nav-link"><a href="{% url 'archive' %}">Все записи</a></p>
</div>
</body>
</html>
