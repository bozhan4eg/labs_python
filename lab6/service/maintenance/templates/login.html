<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>СтанкоСервис — вход</title>
    <link rel="stylesheet" href="{{ STATIC_URL }}css/repair.css">
</head>
<body class="create">
<div class="top-bar">
    <a href="{% url 'register' %}">Регистрация</a>
</div>
<div class="header">
    <img src="{{ STATIC_URL }}img/logo.png" alt="СтанкоСервис — техническое обслуживание станков"/>
</div>
<div class="content">
    <h1>Вход в систему</h1>
    <form method="POST">{% csrf_token %}
        <label for="id_username">Имя пользователя</label>
        <input type="text" name="username" id="id_username" value="{{ form.username }}">

        <label for="id_password">Пароль</label>
        <input type="password" name="password" id="id_password">

        <input type="submit" value="Войти">
    </form>
    {% if form.errors %}
    <ul class="form-errors">
        {% for e in form.errors %}
        <li>{{ e }}</li>
        {% endfor %}
    </ul>
    {% endif %}
    <p class="nav-link"><a href="{% url 'archive' %}">Все записи</a></p>
</div>
</body>
</html>
